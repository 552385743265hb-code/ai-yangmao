<title>AI 羊毛牧场</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Desktop = sticky sidebar + one content column (max 1180px); phone = top bar + bottom tab bar. */
:root{
  --bg:#f1f5ee; --surface:#fbfcf9; --surface-2:#e9efe4; --surface-3:#dde6d6;
  --ink:#1c2921; --ink-2:#4a5a50; --muted:#6f7d73; --line:#d9e2d3; --line-2:#c3cfbc;
  --tag:#f4b91c; --tag-ink:#2a1f00; --tag-soft:#fbeec4;
  --sky-1:#cfe6f3; --sky-2:#eaf5ee; --hill-1:#c3e2aa; --hill-2:#a0cf85; --hill-3:#7bb565; --hill-4:#5f9c4c;
  --wool:#ffffff; --wool-edge:#c9d1c2; --skin:#f2cfc1; --face:#2c2a27; --fence:#a9845a; --sun:#f7c948; --cloud:#ffffff;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300; --warn-ink:#8a5a00; --serious-ink:#a84416; --critical-ink:#b42323;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7;
  --q0:#e8f3de; --q1:#cfe7bd; --q2:#b2d89a; --q3:#90c575; --q4:#6fb053; --q5:#4f963a; --q6:#377a29; --q7:#245d1d;
  --shadow:0 1px 2px rgba(28,41,33,.06),0 8px 24px rgba(28,41,33,.08);
  --f-display:"ZCOOL KuaiLe","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  --f-body:"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Rubik","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1511; --surface:#151e18; --surface-2:#1c2720; --surface-3:#243128;
    --ink:#e9f0e9; --ink-2:#b3c1b6; --muted:#8a978d; --line:#27342c; --line-2:#34453a;
    --tag:#f6c23a; --tag-ink:#231a00; --tag-soft:#3b3218;
    --sky-1:#142336; --sky-2:#1a2c2b; --hill-1:#2b4a2c; --hill-2:#315733; --hill-3:#39653a; --hill-4:#427443;
    --wool:#e6eae2; --wool-edge:#9aa495; --skin:#cfa898; --face:#121110; --fence:#7f6242; --sun:#e9d27a; --cloud:#5a6b76;
    --good-ink:#3fcf3f; --warn-ink:#fab219; --serious-ink:#f09a74; --critical-ink:#ef7a7a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
    --q0:#1c2a1f; --q1:#22402a; --q2:#2a5731; --q3:#336f38; --q4:#3f8841; --q5:#4fa24c; --q6:#66bb5b; --q7:#86d474;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#151e18; --surface-2:#1c2720; --surface-3:#243128;
  --ink:#e9f0e9; --ink-2:#b3c1b6; --muted:#8a978d; --line:#27342c; --line-2:#34453a;
  --tag:#f6c23a; --tag-ink:#231a00; --tag-soft:#3b3218;
  --sky-1:#142336; --sky-2:#1a2c2b; --hill-1:#2b4a2c; --hill-2:#315733; --hill-3:#39653a; --hill-4:#427443;
  --wool:#e6eae2; --wool-edge:#9aa495; --skin:#cfa898; --face:#121110; --fence:#7f6242; --sun:#e9d27a; --cloud:#5a6b76;
  --good-ink:#3fcf3f; --warn-ink:#fab219; --serious-ink:#f09a74; --critical-ink:#ef7a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
  --q0:#1c2a1f; --q1:#22402a; --q2:#2a5731; --q3:#336f38; --q4:#3f8841; --q5:#4fa24c; --q6:#66bb5b; --q7:#86d474;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num)}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:21px;line-height:1;color:var(--ink);white-space:nowrap}
.brand svg{width:34px;height:34px;flex:none}
main{padding-inline:16px;padding-block:14px 112px;min-width:0;width:100%;max-width:1180px;margin-inline:auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;font-size:11px;color:var(--muted);background:none;border:0;cursor:pointer}
.tabbar svg{width:23px;height:23px}
.tabbar .on{color:var(--ink);font-weight:600}
.tabbar .on .ic-dot{fill:var(--tag)}
.cond-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13px;white-space:nowrap}
.cond-btn .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--tag);color:var(--tag-ink);font-size:11px;font-weight:700;display:inline-grid;place-items:center;font-family:var(--f-num)}
@media (min-width:960px){
  .app{grid-template-columns:236px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 18px;border-right:1px solid var(--line);background:var(--surface)}
  .topbar,.tabbar{display:none}
  main{padding-inline:32px;padding-block:24px 64px}
}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--ink-2);font-size:14.5px}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--tag-soft);color:var(--ink);font-weight:600}
.nav a.on .ic-dot{fill:var(--tag)}
.nav-sep{font-size:11px;letter-spacing:.14em;color:var(--muted);padding:12px 10px 3px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px;padding-inline:6px}

/* ---------- page furniture ---------- */
.ribbon{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 12px;margin-bottom:14px}
.ribbon b{color:var(--ink);font-weight:600}
.live{display:inline-flex;align-items:center;gap:7px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in oklab,var(--good) 22%,transparent)}
.sample{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border-radius:6px;background:var(--tag-soft);color:var(--ink);font-weight:600}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin:4px 0 16px}
.ph h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.4vw,38px);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:.01em}
.ph p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.crumb{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;margin-bottom:6px}
.crumb a:hover{color:var(--ink)}
section{margin-block:28px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:12px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:23px;line-height:1.2;margin:0}
.sec-h .hint{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h3{font-size:15px;margin:0 0 2px;font-weight:600}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.chart{width:100%;height:280px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hscroll>.chart{min-width:640px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 10px;color:var(--muted);text-align:center}
.empty svg{width:120px;height:80px}

/* ---------- tokens of the domain ---------- */
.etag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.etag svg{width:14px;height:16px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.2;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.chip.miss{background:transparent;border-color:color-mix(in oklab,var(--critical) 60%,transparent);color:var(--critical-ink)}
.chip.have{background:transparent;border-color:color-mix(in oklab,var(--good) 55%,transparent);color:var(--good-ink)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px 3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.st b{font-family:var(--f-num);font-weight:700;font-size:11px;width:13px;text-align:center}
.st.good{color:var(--good-ink)} .st.warn{color:var(--warn-ink)} .st.serious{color:var(--serious-ink)} .st.critical{color:var(--critical-ink)}
.score{display:inline-flex;align-items:baseline;gap:3px;font-family:var(--f-num);font-weight:700;font-size:13px;padding:2px 8px;border-radius:8px;background:var(--tag-soft);color:var(--ink)}
.score small{font-weight:500;font-size:10.5px;color:var(--ink-2)}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--tag);border-color:var(--tag);color:var(--tag-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.04)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.good{border-color:color-mix(in oklab,var(--good) 60%,transparent);color:var(--good-ink)}
.btn.bad{border-color:color-mix(in oklab,var(--critical) 55%,transparent);color:var(--critical-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
select,input[type="date"],input[type="url"],input[type="text"]{width:100%;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;color:var(--ink)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.tog span small{display:block;color:var(--muted);font-size:12px}
.tog input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tog input:checked{background:var(--s3)}
.tog input:checked::after{transform:translateX(18px)}

/* ---------- today: hero meadow ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 62%)}
.hero-over{position:absolute;left:18px;top:14px;right:18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hero-over>*{pointer-events:auto}
.total{display:flex;flex-direction:column;gap:2px}
.total .l{font-size:13px;color:var(--ink-2)}
.total .v{font-family:var(--f-num);font-weight:700;font-size:clamp(36px,6vw,52px);line-height:1;color:var(--ink);letter-spacing:-.01em}
.total .d{font-size:12.5px;color:var(--ink-2)}
.wx{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:16px;background:color-mix(in oklab,var(--surface) 78%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line)}
.wx svg{width:40px;height:40px;flex:none}
.wx .i{font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1}
.wx .t{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.meadow{display:block;width:100%;height:auto;touch-action:manipulation}
.meadow .sheep{cursor:pointer}
.meadow .sheep:focus{outline:none}
.meadow .sheep:focus-visible .wool-o{stroke:var(--s1);stroke-width:4}
.meadow .bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.meadow .sheep:hover .bob{animation-duration:.9s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.6px) rotate(-1.2deg)}}
.meadow .snip{animation:snip 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:30% 70%}
@keyframes snip{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.flock-legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px;color:var(--ink-2);padding:10px 16px;border-top:1px solid var(--line);background:var(--surface)}
@media (max-width:640px){ .hero-over{position:static;padding:14px 14px 0} }

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){ .kpis{grid-template-columns:repeat(4,minmax(0,1fr))} }
.kpi{padding:12px 14px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k-l{font-size:12.5px;color:var(--ink-2)}
.kpi .k-v{font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1.15}
.kpi .k-v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi svg{width:100%;height:30px;color:var(--s1);margin-top:2px}

.clocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));gap:10px}
.clock{position:relative;display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.clock:hover{border-color:var(--line-2)}
.clock svg{width:54px;height:54px;flex:none}
.clock .cd{font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.clock .ttl{font-size:13px;line-height:1.35;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- offer cards ---------- */
.ocards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.ocard{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 66px;gap:8px 12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.ocard:hover{border-color:var(--line-2);transform:translateY(-1px)}
.ocard .stretch{position:absolute;inset:0;border-radius:16px;z-index:1}
.oc-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.oc-title{font-weight:600;font-size:15.5px;line-height:1.38;margin:0}
.oc-plat{font-size:12.5px;color:var(--muted)}
.oc-val{font-family:var(--f-num);font-size:21px;font-weight:600;line-height:1.2}
.oc-val small{font-size:12px;color:var(--muted);font-weight:500;font-family:var(--f-body);margin-left:4px}
.oc-radar{width:66px;height:66px;align-self:center}
.oc-foot{grid-column:1/-1;display:flex;flex-direction:column;gap:7px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.oc-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.cmp{position:relative;z-index:2;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;font-size:11.5px;padding:2px 8px;cursor:pointer;color:var(--ink-2)}
.cmp[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.orow:hover{background:var(--surface-2)}
.orow .when{font-family:var(--f-num);font-size:13px;color:var(--ink-2);min-width:62px}
.orow .t{font-weight:500;line-height:1.35}
.orow .t small{display:block;font-weight:400;font-size:12px;color:var(--muted)}

/* ---------- calendar ---------- */
.months{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.month h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 2px}
.ramp{display:inline-flex;gap:2px;vertical-align:middle}
.ramp i{width:16px;height:10px;border-radius:3px;display:block}
.hols{display:flex;flex-wrap:wrap;gap:8px}
.hol{display:flex;flex-direction:column;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;max-width:100%}
.hol b{font-size:13.5px}

/* ---------- detail ---------- */
.dt-top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.dt-title{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.4vw,38px);line-height:1.18;margin:8px 0 4px;text-wrap:balance}
.dt-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){ .dt-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)} }
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.fact{padding:10px 12px;border-radius:12px;background:var(--surface-2);min-width:0}
.fact .l{font-size:12px;color:var(--muted)}
.fact .v{font-weight:600;line-height:1.4}

  const cloud = (cx, cy, s) => `<g transform="translate(${cx},${cy}) scale(${s})" style="fill:var(--cloud);opacity:.92"><ellipse cx="0" cy="0" rx="26" ry="12"/><circle cx="-10" cy="-8" r="11"/><circle cx="8" cy="-11" r="14"/><circle cx="22" cy="-3" r="9"/></g>`;

function buildFlock(el, list, wx) {
  const W = Math.max(300, Math.round(el.clientWidth || 800));
  const small = W < 640, H = small ? 330 : 400;
  const base = small ? 0.6 : W < 900 ? 0.78 : 0.95;
  if (!list.length) { el.innerHTML = `<svg class="meadow" viewBox="0 0 ${W} ${H}" aria-hidden="true">${meadowBg(W, H, wx)}</svg>` + emptySheep('按你的条件，草地上暂时没有羊。去"我的条件"放宽一点试试。'); return; }
  const maxU = Math.max(...list.map(o => o.usd));
  const r = rng(20260930);
  const items = list.map(o => ({ o, sc: base * (0.62 + 0.75 * Math.sqrt(o.usd / maxU)) })).sort((a, b) => b.sc - a.sc);
  const top = H * (small ? 0.5 : 0.52), bottom = H - 26 * base;
  const placed = [];
  for (const it of items) {
    const rad = 33 * it.sc;
    let best = null, bestGap = -Infinity;
    for (let k = 0; k < 320; k++) {
      const x = 16 + rad * 1.2 + r() * (W - 32 - rad * 2.4);
      const y = top + rad * 0.5 + r() * Math.max(4, bottom - top - rad * 1.3);
      const gap = placed.length ? Math.min(...placed.map(p => Math.hypot(p.x - x, (p.y - y) * 1.5) - p.rad - rad)) : 999;
      if (gap > bestGap) { best = { x, y }; bestGap = gap; }
      if (gap > 8) break;
    }
    placed.push({ ...it, ...best, rad });
  }
  placed.sort((a, b) => a.y - b.y);
  el.innerHTML = `<svg class="meadow" viewBox="0 0 ${W} ${H}" role="group" aria-label="进行中的羊毛，共 ${list.length} 只羊">${meadowBg(W, H, wx)}${placed.map(sheepSvg).join('')}</svg>`;
  el.dataset.w = W;
  $$('.sheep', el).forEach(g => {
    const o = OMAP[g.dataset.id];
    const html = `<b>${esc(o.t)}</b>${esc(o.plat.name)} · ${TYPES[o.ty].l}<br>${valLabel(o).replace(/<small>/, ' ').replace(/<\/small>/, '')} · ${leftText(o)}<br><span class="muted">薅度 ${score(o)} · 点击看详情</span>`;
    g.addEventListener('mousemove', e => showTip(html, e.clientX, e.clientY));
    g.addEventListener('mouseleave', hideTip);
    g.addEventListener('focus', () => { const b = g.getBoundingClientRect(); showTip(html, b.right, b.top); });
    g.addEventListener('blur', hideTip);
    g.addEventListener('click', () => { hideTip(); location.hash = 'offer-' + o.id; });
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.hash = 'offer-' + o.id; } });
  });
}

})();

  hist.sort((a, b) => b[0] - a[0]);
  const same = OFFERS.filter(x => x.p === o.p && x.id !== o.id);

    setTimeout(() => { const q = QSTATE.find(x => x.id === id); if (q) { q.t = '补录：抽取完成，等你审核'; q.note = '四项证据里缺"有效期"，需要你补充'; drawQ(); } }, 1400);
  });
  $$('[data-ap]').forEach(cb => cb.addEventListener('change', () => { AUTOPUB[+cb.dataset.ap].on = cb.checked; toast(cb.checked ? '已放开自动上架' : '已改回人工审核'); }));
  chart('#cAuto', {
    grid: { left: 8, right: 40, top: 10, bottom: 6, containLabel: true },
    tooltip: { trigger: 'axis', valueFormatter: v => v + '%' },
    xAxis: Object.assign(axisCommon(), { type: 'category', boundaryGap: false, data: ['第1周', '第2周', '第3周', '第4周', '第5周', '第6周', '第7周', '本周'] }),
    yAxis: Object.assign(axisCommon(), { type: 'value', max: 100, axisLabel: { color: TK.muted, formatter: '{value}%' } }),
    series: [{ type: 'line', data: [0, 0, 0, 8, 15, 22, 31, 38], smooth: 0.3, symbol: 'circle', symbolSize: 5, showSymbol: false, lineStyle: { width: 2, color: TK.s[0] }, itemStyle: { color: TK.s[0] }, areaStyle: { color: TK.s[0], opacity: 0.1 }, endLabel: { show: true, formatter: '{c}%', color: TK.ink2, fontFamily: FONT } }],
  });
  const fcol = ['#86b6ef', '#5598e7', '#2a78d6', '#1c5cab'];
  chart('#cFunnel', {
    tooltip: { trigger: 'item', formatter: p => `${p.name}：<b>${p.value}</b> 条` },
    series: [{ type: 'funnel', left: '6%', right: '6%', top: 6, bottom: 6, minSize: '18%', gap: 3, sort: 'descending', itemStyle: { borderWidth: 0, borderRadius: 4 }, label: { show: true, position: 'inside', fontFamily: FONT, formatter: p => `${p.name} ${p.value}` }, data: [['线索', 312], ['待审', 86], ['上架', 49], ['已结束', 12]].map(([n, v], i) => ({ name: n, value: v, itemStyle: { color: fcol[i] }, label: { color: onColor(fcol[i]) } })) }],
  });
}
function ecg(h) {
  let s = '';
  h.forEach((ok, i) => {
    const x = 2 + i * 5.2;
    s += ok ? `<path d="M${x.toFixed(1)},14 h1 l1,-8 l1.2,13 l1,-5 h1" style="fill:none;stroke:var(--good);stroke-width:1.3;stroke-linejoin:round"/>` : `<path d="M${x.toFixed(1)},14 h5.2" style="stroke:var(--critical);stroke-width:2"/><circle cx="${(x + 2.6).toFixed(1)}" cy="14" r="1.8" style="fill:var(--critical)"/>`;
  });
  return `<svg class="ecg" viewBox="0 0 160 26" aria-label="最近 30 次抓取，失败 ${h.filter(x => !x).length} 次">${s}</svg>`;
}

/* ============================================================
 * 外壳：导航、条件面板、对比、路由
 * ============================================================ */
const PAGES = { today: pToday, calendar: pCalendar, timeline: pTimeline, insights: pInsights, all: pAll, library: pLibrary, apply: pApply, models: pModels, mine: pMine, coverage: pCoverage, admin: pAdmin };
const NAVS = [
  ['逛牧场', [['today', '今天'], ['calendar', '日历'], ['timeline', '时间线'], ['insights', '洞察']]],
  ['找羊毛', [['all', '全部羊毛'], ['library', '常驻额度库'], ['apply', '申请制'], ['models', '按模型找']]],
  ['我', [['mine', '我的']]],
  ['关于', [['coverage', '覆盖范围'], ['admin', '后台']]],
];
const TITLES = Object.fromEntries(NAVS.flatMap(g => g[1]));
function drawShell() {
  $$('[data-brand]').forEach(el => { el.innerHTML = BRAND; });
  $('#sideNav').innerHTML = NAVS.map(([g, items]) => `<div class="nav-sep">${g}</div>${items.map(([k, l]) => `<a href="#${k}" data-nav="${k}">${ICON[k]}${l}</a>`).join('')}`).join('');
  $('#tabbar').innerHTML = [['today', '今天'], ['calendar', '日历'], ['timeline', '时间线'], ['insights', '洞察']].map(([k, l]) => `<a href="#${k}" data-nav="${k}">${ICON[k]}<span>${l}</span></a>`).join('') + `<button type="button" data-more>${ICON.more}<span>更多</span></button>`;
  $('#sideFoot').innerHTML = `<span class="live"><i></i>最近更新 ${hm(LAST_OK)}</span><span>RSS 订阅（上线后可用）</span><a href="#coverage" style="text-decoration:underline">只收能追到官方出处的羊毛，不保证覆盖所有活动</a>`;
  drawCondBtn();
}
function drawCondBtn() {
  const n = COND_ITEMS.filter(([k]) => !['realname', 'pay'].includes(k) && C[k]).length + C.members.length;
  $$('[data-open-cond]').forEach(b => { if (b.classList.contains('cond-btn')) b.innerHTML = `我的条件${n ? `<span class="badge">${n}</span>` : ''}${C.only ? ' · 只看能薅' : ''}`; });
}
function markNav(name) {
  $$('[data-nav]').forEach(a => { const on = a.dataset.nav === name; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const moreOn = !['today', 'calendar', 'timeline', 'insights'].includes(name);
  const mb = $('[data-more]'); if (mb) mb.classList.toggle('on', moreOn);
}
let SHEET_CHARTS = new Set();
function openSheet(title, html, after) {
  $('#sheetPanel').innerHTML = `<div class="sheet-head"><h2 id="sheetTitle">${title}</h2><button class="btn sm" type="button" data-close>关闭</button></div>${html}`;
  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  after && after();
  const f = $('#sheetPanel [data-close]'); f && f.focus();
}
function closeSheet() {
  SHEET_CHARTS.forEach(c => c.dispose()); SHEET_CHARTS.clear();
  $('#sheet').hidden = true; document.body.style.overflow = '';
}
function openCond() { openSheet('我的条件', condForm()); }
function openMore() {
  const items = [['all', '全部羊毛'], ['library', '常驻额度库'], ['apply', '申请制'], ['models', '按模型找'], ['mine', '我的'], ['coverage', '覆盖范围'], ['admin', '后台']];
  openSheet('更多', `<div class="more-nav">${items.map(([k, l]) => `<a href="#${k}" data-close>${ICON[k]}${l}</a>`).join('')}</div>`);
}
function drawTray() {
  const t = $('#tray');
  if (!CMP.length) { t.hidden = true; return; }
  t.hidden = false;
  t.innerHTML = `<span>已选 ${CMP.length} 条对比（最多 3 条）</span><button class="btn sm" type="button" data-cmp-open>开始对比</button><button class="btn sm" type="button" data-cmp-clear style="background:transparent;color:var(--bg);border-color:transparent">清空</button>`;
}
function openCompare() {
  const list = CMP.map(id => OMAP[id]);
  const rowsDef = [['额度', o => valLabel(o).replace(/<[^>]+>/g, ' ')], ['薅度分', o => score(o)], ['类型', o => TYPES[o.ty].l], ['门槛', o => o.r.map(reqLabel).join('、')], ['领取截止', o => o.ek === 'date' ? md(dayAt(o.e)) : o.ek === 'unknown' ? '截止未知' : '长期'], ['额度有效期', o => o.val]];
  openSheet('对比', `<div class="chart" id="cCmp" style="height:300px"></div><div class="tbl"><table><thead><tr><th></th>${list.map((o, i) => `<th><span class="row" style="gap:6px;flex-wrap:nowrap"><i class="sw" style="background:var(--s${i + 1})"></i>${esc(o.plat.name)}</span></th>`).join('')}</tr></thead><tbody>${rowsDef.map(([k, f]) => `<tr><td class="muted">${k}</td>${list.map(o => `<td style="white-space:normal;min-width:120px">${esc(f(o))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`, () => {
    chart('#cCmp', {
      legend: Object.assign(legendCommon(), { bottom: 0, data: list.map(o => o.t.length > 14 ? o.t.slice(0, 13) + '…' : o.t) }),
      tooltip: { trigger: 'item' },
      radar: { indicator: DIMS.map(n => ({ name: n, max: 100 })), radius: '60%', center: ['50%', '46%'], splitNumber: 4, axisName: { color: TK.ink2, fontSize: 12 }, splitLine: { lineStyle: { color: TK.line2 } }, splitArea: { areaStyle: { color: [TK.surface, TK.surface2] } }, axisLine: { lineStyle: { color: TK.line2 } } },
      series: [{ type: 'radar', data: list.map((o, i) => ({ value: dims(o), name: o.t.length > 14 ? o.t.slice(0, 13) + '…' : o.t, lineStyle: { color: TK.s[i], width: 2 }, itemStyle: { color: TK.s[i] }, areaStyle: { color: TK.s[i], opacity: 0.12 }, symbolSize: 5 })) }],
    }, SHEET_CHARTS);
  });
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'today';
  if (h.startsWith('offer-')) return ['offer', h.slice(6)];
  if (h.startsWith('platform-')) return ['platform', h.slice(9)];
  return [PAGES[h] ? h : 'today', null];
}
function render(keepScroll) {
  TK = tk();
  const [name, arg] = route();
  CHARTS.forEach(c => c.dispose()); CHARTS.clear(); hideTip();
  const y = window.scrollY;
  if (name === 'offer') pOffer(arg); else if (name === 'platform') pPlatform(arg); else PAGES[name]();
  markNav(name === 'offer' || name === 'platform' ? '' : name);
  document.title = name === 'offer' && OMAP[arg] ? `${OMAP[arg].t} · AI 羊毛牧场` : name === 'platform' && PMAP[arg] ? `${PMAP[arg].name} · AI 羊毛牧场` : `${TITLES[name] || '今天'} · AI 羊毛牧场`;
  drawTray();
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}

/* ---------- 全局事件 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open-cond],[data-more],[data-close],[data-cmp],[data-cmp-open],[data-cmp-clear],[data-want],[data-got],[data-mem],tr[data-href]');
  if (!t) return;
  if (t.matches('[data-open-cond]')) { e.preventDefault(); openCond(); return; }
  if (t.matches('[data-more]')) { openMore(); return; }
  if (t.matches('[data-close]')) { closeSheet(); return; }
  if (t.matches('tr[data-href]')) { location.hash = t.dataset.href.slice(1); return; }
  if (t.matches('[data-cmp]')) {
    e.preventDefault(); const id = t.dataset.cmp;
    if (CMP.includes(id)) CMP = CMP.filter(x => x !== id);
    else { if (CMP.length >= 3) { toast('最多对比 3 条，先去掉一条'); return; } CMP.push(id); }
    $$(`[data-cmp="${id}"]`).forEach(b => b.setAttribute('aria-pressed', CMP.includes(id)));
    drawTray(); return;
  }
  if (t.matches('[data-cmp-open]')) { openCompare(); return; }
  if (t.matches('[data-cmp-clear]')) { CMP = []; $$('[data-cmp]').forEach(b => b.setAttribute('aria-pressed', 'false')); drawTray(); return; }
  if (t.matches('[data-want]') || t.matches('[data-got]')) {
    const key = t.matches('[data-want]') ? 'want' : 'got', id = t.dataset[key];
    MINE[key] = MINE[key].includes(id) ? MINE[key].filter(x => x !== id) : [...MINE[key], id];
    LS.set('ym-mine', MINE); toast(MINE[key].includes(id) ? (key === 'want' ? '已加入想领' : '已记为已领') : '已取消'); render(true); return;
  }
  if (t.matches('[data-mem]')) {
    const m = t.dataset.mem;
    C.members = C.members.includes(m) ? C.members.filter(x => x !== m) : [...C.members, m];
    t.setAttribute('aria-pressed', C.members.includes(m));
    LS.set('ym-cond', C); drawCondBtn(); render(true);
  }
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-c]'); if (!t) return;
  C[t.dataset.c] = t.checked; LS.set('ym-cond', C); drawCondBtn();
  $$(`[data-c="${t.dataset.c}"]`).forEach(x => { x.checked = t.checked; });
  render(true);
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('hashchange', () => { closeSheet(); render(false); });
let rsT;
window.addEventListener('resize', () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => {
    CHARTS.forEach(c => c.resize()); SHEET_CHARTS.forEach(c => c.resize());
    const f = $('#flock'); if (f && Math.abs((+f.dataset.w || 0) - f.clientWidth) > 40) buildFlock(f, view(OFFERS.filter(activeLimited)), weatherNow());
  }, 180);
});
setInterval(() => {
  const now = Date.now();
  $$('[data-end]').forEach(el => { el.textContent = cdText(+el.dataset.end - now); });
  $$('[data-since]').forEach(el => { el.textContent = cdText(now - +el.dataset.since); });
}, 1000);
const reTheme = () => render(true);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reTheme);
new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

drawShell();
if (window.echarts) render(false);
else main().innerHTML = ribbon() + emptySheep('图表库没有加载成功，请检查网络后刷新。');
</script>
