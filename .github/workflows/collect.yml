name: 采集

on:
  # 定时由 Cloudflare Worker 负责（wrangler.jsonc 的 17 */6 * * *，调用 workflow_dispatch）；GitHub 自带定时从未触发，已移除
  workflow_dispatch:
    inputs:
      dry_run:
        description: '演练模式：只抓取、不写入'
        type: boolean
        default: false
      only_sources:
        description: '只跑这些信源（逗号分隔的 id，留空为全部）'
        type: string
        default: ''
      force:
        description: '忽略上次比对结果，强制重新抽取（提示词改进后补跑）'
        type: boolean
        default: false
      fast_leads:
        description: '快速通道：只采集重要线索并研判，跳过全站复核'
        type: boolean
        default: false
      lead_limit:
        description: '本轮最多研判多少条线索'
        type: string
        default: '50'

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 运行采集管线
        run: npm run collect
        env:
          API_BASE: ${{ secrets.API_BASE }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_MODEL: ${{ vars.GLM_MODEL || 'glm-4-flash' }}
          USE_GLM: ${{ vars.USE_GLM || '0' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          DEEPSEEK_PRICE_IN: ${{ vars.DEEPSEEK_PRICE_IN || '3' }}
          DEEPSEEK_PRICE_OUT: ${{ vars.DEEPSEEK_PRICE_OUT || '10' }}
          MONTHLY_COST_CAP_CNY: ${{ vars.MONTHLY_COST_CAP_CNY || '10' }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          DAILY_TOKEN_CAP: ${{ vars.DAILY_TOKEN_CAP || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ONLY_SOURCES: ${{ inputs.only_sources }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          LEAD_LIMIT: ${{ inputs.lead_limit || '50' }}
          FAST_LEADS: ${{ inputs.fast_leads && '1' || '0' }}
