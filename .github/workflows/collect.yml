name: 采集

on:
  schedule:
    - cron: '17 */6 * * *' # 每 6 小时（避开整点高峰，GitHub 定时任务可能延迟）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '演练模式：只抓取、不写入'
        type: boolean
        default: false
      only_sources:
        description: '只跑这些信源（逗号分隔的 id，留空为全部）'
        type: string
        default: ''

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 运行采集管线
        run: npm run collect
        env:
          API_BASE: ${{ secrets.API_BASE }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          DAILY_TOKEN_CAP: ${{ vars.DAILY_TOKEN_CAP || '200000' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ONLY_SOURCES: ${{ inputs.only_sources }}
